name: Refresh PortfolioPilot Data

# Three ways this runs:
#   1. Daily, early morning UTC - fast refresh: prices + price signals/anomalies only.
#   2. Weekly, Monday - full refresh: filings, ratios, filing text, vector store,
#      and retrains all ML models (classifiers, Lasso, K-Means).
#   3. Manually, any time, via the "Run workflow" button on GitHub - always runs
#      the FULL pipeline. Use this for demos/office hours instead of waiting
#      for the schedule.
on:
  schedule:
    - cron: "0 6 * * *"    # daily at 06:00 UTC - fast price refresh
    - cron: "0 7 * * 1"    # Mondays at 07:00 UTC - full refresh + retrain
  workflow_dispatch: {}     # manual "Run workflow" button - always full refresh

env:
  TICKERS: "NKE AAPL MSFT"
  # Optional: set SEC_USER_AGENT as a repo secret (Settings -> Secrets -> Actions)
  # if you want to override the default hardcoded in fetch_filings.py.
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

jobs:
  determine-mode:
    runs-on: ubuntu-latest
    outputs:
      full_refresh: ${{ steps.mode.outputs.full_refresh }}
    steps:
      - id: mode
        run: |
          # Manual runs and the Monday cron both trigger the full pipeline.
          # The daily cron (any other day) only does the fast price refresh.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "full_refresh=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 7 * * 1" ]; then
            echo "full_refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "full_refresh=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: determine-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit refreshed data/models back to the repo
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- Fast path: runs every day ---
      - name: Fetch latest prices
        run: python fetch_prices.py --tickers $TICKERS

      - name: Recompute price signals and anomalies
        run: python price_signals.py --tickers $TICKERS

      # --- Full path: only on Mondays or manual trigger ---
      - name: Fetch latest SEC filings
        if: needs.determine-mode.outputs.full_refresh == 'true'
        run: python fetch_filings.py --tickers $TICKERS

      - name: Fetch latest filing text
        if: needs.determine-mode.outputs.full_refresh == 'true'
        run: python fetch_filing_text.py --tickers $TICKERS

      - name: Recompute financial ratios
        if: needs.determine-mode.outputs.full_refresh == 'true'
        run: python compute_ratios.py --tickers $TICKERS

      - name: Rebuild filing text vector store
        if: needs.determine-mode.outputs.full_refresh == 'true'
        run: python build_vector_store.py --tickers $TICKERS

      - name: Retrain classifiers (per ticker)
        if: needs.determine-mode.outputs.full_refresh == 'true'
        run: |
          for t in $TICKERS; do
            python train_classifiers.py --ticker "$t"
          done

      - name: Rerun Lasso feature selection (per ticker)
        if: needs.determine-mode.outputs.full_refresh == 'true'
        run: |
          for t in $TICKERS; do
            python lasso_selection.py --ticker "$t"
          done

      - name: Recompute company clusters
        if: needs.determine-mode.outputs.full_refresh == 'true'
        run: python cluster_companies.py --tickers $TICKERS

      # --- Commit whatever changed back to the repo ---
      - name: Commit refreshed data and models
        run: |
          git config user.name "portfoliopilot-bot"
          git config user.email "actions@github.com"
          git add data/ models/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Automated data refresh ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
